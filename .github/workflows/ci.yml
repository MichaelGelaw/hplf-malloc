name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - debug-clang
          - asan-ubsan
          - tsan

    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: Test
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure
